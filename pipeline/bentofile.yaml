service: "service.py:WineClassifierService"
labels:
  project: modelforge
  owner: cloud-devops-team
  stage: production
python:
  packages:
    - scikit-learn>=1.2.0
    - numpy>=1.22.0
    - pandas>=1.5.0
    - pydantic>=2.0
include:
  - "service.py"
  - "models/production_model.pkl"
  - "models/production_metrics.json"
exclude:
  - "models/model.pkl"
  - "models/metrics.json"
  - "data/"
  - "*.pyc"
  - "__pycache__/"
