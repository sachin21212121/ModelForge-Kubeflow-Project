<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelForge - Production ML Lifecycle Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-glow"></div>
                <div class="brand-title">Model<span>Forge</span></div>
                <div class="brand-subtitle">ML Lifecycle Platform</div>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Control Center</span>
                </button>
                <button class="nav-item" data-tab="experiments">
                    <i data-lucide="flask-conical"></i>
                    <span>MLflow Experiments</span>
                </button>
                <button class="nav-item" data-tab="registry">
                    <i data-lucide="archive"></i>
                    <span>Model Registry</span>
                </button>
                <button class="nav-item" data-tab="serving">
                    <i data-lucide="cpu"></i>
                    <span>BentoML Serving</span>
                </button>
                <button class="nav-item" data-tab="monitor">
                    <i data-lucide="activity"></i>
                    <span>Drift & Retraining</span>
                </button>
                <button class="nav-item" data-tab="k8s">
                    <i data-lucide="boxes"></i>
                    <span>Kubernetes Cluster</span>
                </button>
                <button class="nav-item" data-tab="configs">
                    <i data-lucide="file-code-2"></i>
                    <span>Configs & Manifests</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="status-indicator online">
                    <span class="pulse-dot"></span>
                    <span>System Connected</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1 id="page-title">Control Center</h1>
                <div class="system-stats">
                    <div class="stat-card-mini">
                        <span class="stat-label">Model Status</span>
                        <span class="stat-value text-emerald" id="prod-status-header">N/A</span>
                    </div>
                    <div class="stat-card-mini">
                        <span class="stat-label">K8s Pods</span>
                        <span class="stat-value" id="k8s-pod-count">0 Active</span>
                    </div>
                    <div class="stat-card-mini">
                        <span class="stat-label">Serving Replicas</span>
                        <span class="stat-value" id="k8s-replicas-header">0 / 0</span>
                    </div>
                </div>
            </header>

            <div id="tab-content" class="tab-view-container">
                <!-- dynamic load -->
            </div>
        </main>
    </div>

    <div id="notification-toast" class="toast">
        <i data-lucide="bell" id="toast-icon"></i>
        <div class="toast-body">
            <div class="toast-title" id="toast-title">Notification</div>
            <div class="toast-desc" id="toast-desc">Message.</div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="components/experiments.js"></script>
    <script src="components/registry.js"></script>
    <script src="components/serving.js"></script>
    <script src="components/monitor.js"></script>
    <script src="components/k8s-cluster.js"></script>
    <script src="components/configs.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
