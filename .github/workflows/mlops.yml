name: ModelForge MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Set up Docker Buildx (for faster builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push Unified Container Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: sachin2223/modelforge:latest
          cache-from: type=registry,ref=sachin2223/modelforge:buildcache
          cache-to: type=registry,ref=sachin2223/modelforge:buildcache,mode=max

      # 5. Set up Kubectl context (for deployment to your cluster)
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}

      # 6. Deploy Manifests to cluster
      - name: Deploy Manifests
        run: |
          kubectl apply -f k8s/
          
      # 7. Force Run Retraining Job to update model version
      - name: Trigger Retraining Job
        run: |
          # Delete existing job if it exists to allow re-creation
          kubectl delete job modelforge-retraining-job -n modelforge --ignore-not-found=true
          kubectl create -f k8s/job-retraining.yaml
